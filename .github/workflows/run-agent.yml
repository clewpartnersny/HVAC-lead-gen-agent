name: HVAC lead-gen agent

# Runs on a schedule and works through the MSA list a few metros at a time.
# Progress is checkpointed in the output sheet's state tab, so each run resumes
# where the last one left off. Adjust the cron / MAX_MSAS_PER_RUN to control pace.
on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours, on the hour (UTC)
  workflow_dispatch:        # allow manual runs from the Actions tab
    inputs:
      max_msas:
        description: "Override MAX_MSAS_PER_RUN for this run"
        required: false
        default: ""
      dry_run:
        description: "Set to 1 for a no-write dry run"
        required: false
        default: "0"

# Don't let a scheduled run start while another is still going — avoids double
# work and racey sheet writes.
concurrency:
  group: hvac-lead-gen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # under the 6h hard cap; we checkpoint anyway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
          MAPS_PROVIDER: ${{ vars.MAPS_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MSA_SHEET_ID: ${{ secrets.MSA_SHEET_ID }}
          OUTPUT_SHEET_ID: ${{ secrets.OUTPUT_SHEET_ID }}
          # Optional overrides (fall back to .env.example defaults if unset).
          MSA_WORKSHEET: ${{ vars.MSA_WORKSHEET }}
          OUTPUT_WORKSHEET: ${{ vars.OUTPUT_WORKSHEET }}
          MIN_REVENUE_USD: ${{ vars.MIN_REVENUE_USD }}
          SEARCH_TERMS: ${{ vars.SEARCH_TERMS }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MAX_MSAS_PER_RUN: ${{ github.event.inputs.max_msas || vars.MAX_MSAS_PER_RUN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python main.py
